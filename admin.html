<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChromoLab · Récolte</title>
<style>
body{margin:0;background:#f4f8fc;color:#172b4d;font-family:system-ui,sans-serif}.wrap{width:min(1200px,94%);margin:35px auto}.card{background:#fff;border:1px solid #dfe8f2;border-radius:22px;padding:28px}h1{margin:0 0 8px}p{color:#687990;line-height:1.6}label{display:block;font-weight:800;margin:15px 0 7px}input{width:100%;max-width:650px;padding:13px;border:1px solid #ccd9e6;border-radius:11px;font:inherit}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer}.primary{background:#17558e;color:#fff}.secondary{background:#edf2f7;color:#24415f}.status{padding:12px;border-radius:10px;background:#f0f7ff}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.metric{background:#f6f9fc;border-radius:15px;padding:17px;text-align:center}.metric b{display:block;font-size:25px}.metric small{color:#6c7b8e}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{padding:10px;border-bottom:1px solid #e5edf5;text-align:left;font-size:13px;vertical-align:top}@media(max-width:800px){.metrics{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><div class="card">
<h1>🔐 Espace de récolte ChromoLab</h1><p>Les résultats envoyés par le test sont consultables ici. Ils sont stockés dans ton Google Sheet.</p>
<label>URL Google Apps Script</label><input id="api" value="https://script.google.com/macros/s/AKfycbzA0FR6_ZVV5iWaYUn0rW5AoJH2qLqJ5ULgb-WQA-Dc7K_Ck2IbJHW8_0Kc2mWfwL8e7Q/exec" placeholder="https://script.google.com/macros/s/.../exec">
<label>Mot de passe administrateur</label><input id="pwd" type="password">
<div class="actions"><button class="primary" onclick="loadData()">Actualiser les réponses</button><button class="secondary" onclick="downloadCSV()">Exporter CSV</button></div>
<div id="status" class="status">Aucune donnée chargée.</div>
<div class="metrics"><div class="metric"><b id="n">0</b><small>Participations</small></div><div class="metric"><b id="score">–</b><small>Score moyen</small></div><div class="metric"><b id="time">–</b><small>Temps moyen</small></div><div class="metric"><b id="max">–</b><small>Meilleur score</small></div></div>
<div class="tablewrap"><table><thead><tr><th>Date</th><th>Genre</th><th>Âge</th><th>Expérience</th><th>Score</th><th>%</th><th>Temps</th><th>Réponses</th></tr></thead><tbody id="rows"></tbody></table></div>
</div></div>
<script>
let data=[];const $=id=>document.getElementById(id);function fmt(x){return Number(x).toFixed(2).replace(".",",")+" s"}
async function loadData(){const url=$("api").value.trim(),pwd=$("pwd").value;if(!url){$("status").textContent="⚠️ Indique l'URL.";return}$("status").textContent="Chargement…";try{const r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"list",password:pwd})});const o=await r.json();if(!o.ok)throw Error(o.error||"Accès refusé");data=o.records||[];render();$("status").textContent="✓ "+data.length+" participation(s)."}catch(e){$("status").textContent="⚠️ "+e.message}}
function render(){$("n").textContent=data.length;if(!data.length){$("score").textContent=$("time").textContent=$("max").textContent="–";$("rows").innerHTML="";return}$("score").textContent=(data.reduce((s,x)=>s+Number(x.pct||0),0)/data.length).toFixed(1).replace(".",",")+"%";$("time").textContent=fmt(data.reduce((s,x)=>s+Number(x.avg||0),0)/data.length);$("max").textContent=Math.max(...data.map(x=>Number(x.score||0)));$("rows").innerHTML=data.map(x=>`<tr><td>${new Date(x.id).toLocaleString("fr-FR")}</td><td>${x.gender||""}</td><td>${x.age||""}</td><td>${x.previous||""}</td><td>${x.score||0}/8</td><td>${Number(x.pct||0).toFixed(1)}%</td><td>${fmt(x.avg||0)}</td><td>${(x.answers||[]).map(a=>`P${a.plate}: ${a.answer} · ${a.correct?"✓":"✗"} · ${fmt(a.time)}`).join("<br>")}</td></tr>`).join("")}
function downloadCSV(){if(!data.length){alert("Charge les données d'abord.");return}let rows=[["ID","Genre","Age","Test précédent","Score","Pourcentage","Temps moyen (s)","Réponses"]];for(const x of data)rows.push([x.id,x.gender,x.age,x.previous,x.score,Number(x.pct||0).toFixed(2),Number(x.avg||0).toFixed(3),(x.answers||[]).map(a=>`P${a.plate}=${a.answer};${a.correct?"correct":"incorrect"};${Number(a.time).toFixed(3)}s`).join(" | ")]);const b=new Blob(["\ufeff"+rows.map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(";")).join("\n")],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="chromolab_reponses.csv";a.click()}
</script></body></html>
